name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
env:
  BINARY_NAME: plumesign

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: $GITHUB_REF_NAME -> Cargo version: $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)*$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not valid semver (stripped: '$VERSION'). Use tags like v2.3.0."
            exit 1
          fi
          sed -i -E "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          grep -A3 '\[workspace.package\]' Cargo.toml

      - name: Build binaries
        run: |
          cargo test -p plume_core --test crypto
          cargo build -p plumesign --release
          mkdir -p dist
          cp target/release/plumesign dist/plumesign-linux-${{ matrix.arch }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm

      - name: Sync Cargo version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: $GITHUB_REF_NAME -> Cargo version: $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)*$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not valid semver (stripped: '$VERSION'). Use tags like v2.3.0."
            exit 1
          fi
          sed -i -E "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          grep -A3 '\[workspace.package\]' Cargo.toml

      - name: Build binaries
        run: |
          cargo build -p plumesign --release --target x86_64-pc-windows-gnu
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/plumesign.exe dist/plumesign-windows-x86_64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Sync Cargo version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: $GITHUB_REF_NAME -> Cargo version: $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)*$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not valid semver (stripped: '$VERSION'). Use tags like v2.3.0."
            exit 1
          fi
          sed -i '' -E "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          grep -A3 '\[workspace.package\]' Cargo.toml

      - name: Build binaries
        run: |
          cargo build -p plumesign --release --target aarch64-apple-darwin
          cargo build -p plumesign --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/plumesign-macos-universal \
            target/aarch64-apple-darwin/release/plumesign \
            target/x86_64-apple-darwin/release/plumesign
          lipo -info dist/plumesign-macos-universal

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-macos-universal
          path: dist/*

  release:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    steps:
      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64
          path: prepare/

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-aarch64
          path: prepare/

      - name: Download Windows x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: prepare/

      - name: Download macOS universal artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-macos-universal
          path: prepare/

      - name: Prepare uploads
        run: |
          mkdir -p upload
          shopt -s globstar
          mv prepare/**/* upload/
          ls -l upload/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: upload/*
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
